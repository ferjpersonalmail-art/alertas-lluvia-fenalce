# =====================================================================
#  ALERTAS DE LLUVIA POR RADAR · FENALCE · Equipo de Agroclimatología
#  Fase 1 (semiautomática): el sistema detecta el evento, redacta el
#  mensaje y te avisa al celular; tú revisas y lo reenvías a la mesa
#  técnica por WhatsApp con un toque.
# =====================================================================

general:
  utc_offset_horas: -5                     # hora de Colombia
  portal_url: https://agroclima-fenalce-portal.vercel.app/
  firma: "FENALCE · Equipo de Agroclimatología"

