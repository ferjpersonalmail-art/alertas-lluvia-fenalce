name: Alertas de lluvia (radar)

on:
  schedule:
    - cron: "3-59/10 * * * *"      # cada 10 minutos (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: "normal | simular | prueba | cobertura"
        required: false
        default: "normal"

permissions:
  contents: write                   # para guardar estado/ y historial/ en el repositorio

concurrency:
  group: alertas-lluvia
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar cuadros de radar ya descargados
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: radar-${{ github.run_id }}
          restore-keys: radar-

      - name: Ejecutar motor de alertas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python motor_alertas.py --modo "${{ github.event.inputs.modo || 'normal' }}"

      - name: Guardar cuadros de radar para la próxima ejecución
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cache
          key: radar-${{ github.run_id }}

      - name: Guardar estado y bitácora
        run: |
          git config user.name "alertas-lluvia-bot"
          git config user.email "alertas-lluvia-bot@users.noreply.github.com"
          for d in estado historial salida; do [ -d "$d" ] && git add -A "$d"; done
          if ! git diff --cached --quiet; then
            git commit -m "Bitácora de alertas $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
